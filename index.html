<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#111827">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Pengeluaran Berdua"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <title>Pengeluaran Berdua</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f5f6f8;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .topbar {
      background: #111827;
      color: white;
      padding:
        calc(14px + env(safe-area-inset-top))
        18px
        14px;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .container {
      width: min(100% - 24px, 1050px);
      margin: auto;
      padding: 24px 0 45px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin-top: 6px;
      color: #70757d;
      font-size: 14px;
    }

    .card {
      background: white;
      border: 1px solid #e1e3e6;
      border-radius: 14px;
      padding: 18px;
      margin-top: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.035);
    }

    .card-title {
      margin: 0 0 15px;
      font-size: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d7d9dd;
      border-radius: 9px;
      padding: 11px 12px;
      font: inherit;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #777;
    }

    textarea {
      min-height: 75px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      background: #222;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    .btn-secondary {
      background: #eee;
      color: #222;
    }

    .btn-danger {
      background: transparent;
      color: #b42318;
      padding: 4px 7px;
    }

    .btn-edit {
      background: transparent;
      color: #175cd3;
      padding: 4px 7px;
    }

    .status {
      margin-top: 9px;
      min-height: 20px;
      font-size: 14px;
    }

    .success {
      color: #18794e;
    }

    .error {
      color: #b42318;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .summary-box {
      border: 1px solid #e3e5e8;
      border-radius: 11px;
      padding: 13px;
      background: #fafafa;
    }

    .summary-box small {
      display: block;
      color: #70757d;
      margin-bottom: 5px;
    }

    .summary-box strong {
      font-size: 17px;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
    }

    .filter-item {
      min-width: 180px;
      flex: 1;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #e3e5e8;
      border-radius: 10px;
      margin-top: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid #e8e9eb;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #fafafa;
      font-weight: 700;
    }

    tbody tr:nth-child(even) {
      background: #fcfcfc;
    }

    td.nominal {
      text-align: right;
      white-space: nowrap;
    }

    .actions {
      white-space: nowrap;
    }

    .total-row {
      font-weight: 700;
      background: #f5f5f5 !important;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .loading {
      color: #777;
      padding: 10px 0;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(100%, 520px);
      background: white;
      border-radius: 14px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 15px;
    }

    @media (max-width: 700px) {

      .container {
        width: calc(100% - 18px);
        padding-top: 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .card {
        padding: 15px;
      }

    }

    @media (max-width: 430px) {

      .summary {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 23px;
      }

    }

  </style>
</head>


<body>

  <div class="topbar">
    💰 Pengeluaran Berdua
  </div>


  <div class="container">

    <h1>Pengeluaran Berdua</h1>

    <div class="subtitle">
      Catat pengeluaran per transaksi.
    </div>


    <!-- TAMBAH -->

    <div class="card">

      <h2 class="card-title">
        Tambah Pengeluaran
      </h2>

      <form id="expenseForm">

        <div class="form-grid">

          <div>
            <label>Tanggal</label>

            <input
              type="date"
              id="tanggal"
              required
            >
          </div>


          <div>

            <label>Duit siapa?</label>

            <select id="pemilik" required>

              <option value="">
                Pilih
              </option>

              <option value="Aufar">
                Aufar
              </option>

              <option value="Mei">
                Mei
              </option>

              <option value="Tabungan Berdua">
                Tabungan Berdua
              </option>

            </select>

          </div>


          <div>

            <label>Transaksi</label>

            <select id="kategori" required>

              <option value="">
                Pilih
              </option>

              <option value="Makan">
                Makan
              </option>

              <option value="Bensin">
                Bensin
              </option>

              <option value="Gojek">
                Gojek
              </option>

              <option value="Belanja">
                Belanja
              </option>

              <option value="Lain-lain">
                Lain-lain
              </option>

            </select>

          </div>


          <div>

            <label>Nominal (Rp)</label>

            <input
              type="number"
              id="nominal"
              min="0"
              step="1"
              placeholder="Contoh: 50000"
              required
            >

          </div>


          <div class="full">

            <label>
              Catatan
              <span style="font-weight:400;color:#888">
                (opsional)
              </span>
            </label>

            <textarea
              id="catatan"
              placeholder="Contoh: makan siang, bensin motor, dll."
            ></textarea>

          </div>


          <div class="full">

            <button
              class="btn"
              type="submit"
              id="submitBtn"
            >
              Tambah Pengeluaran
            </button>

            <div
              class="status"
              id="status"
            ></div>

          </div>

        </div>

      </form>

    </div>


    <!-- SUMMARY -->

    <div class="card">

      <h2 class="card-title">
        Ringkasan Bulan Ini
      </h2>

      <div class="summary">

        <div class="summary-box">

          <small>
            Total Pengeluaran
          </small>

          <strong id="totalBulan">
            Rp0
          </strong>

        </div>


        <div class="summary-box">

          <small>
            Aufar
          </small>

          <strong id="totalAufar">
            Rp0
          </strong>

        </div>


        <div class="summary-box">

          <small>
            Mei
          </small>

          <strong id="totalMei">
            Rp0
          </strong>

        </div>


        <div class="summary-box">

          <small>
            Tabungan Berdua
          </small>

          <strong id="totalBerdua">
            Rp0
          </strong>

        </div>

      </div>

    </div>


    <!-- RIWAYAT -->

    <div class="card">

      <h2 class="card-title">
        Riwayat Pengeluaran
      </h2>


      <div class="filter-row">

        <div class="filter-item">

          <label>
            Bulan
          </label>

          <input
            type="month"
            id="filterBulan"
          >

        </div>


        <div class="filter-item">

          <label>
            Duit siapa?
          </label>

          <select id="filterPemilik">

            <option value="">
              Semua
            </option>

            <option value="Aufar">
              Aufar
            </option>

            <option value="Mei">
              Mei
            </option>

            <option value="Tabungan Berdua">
              Tabungan Berdua
            </option>

          </select>

        </div>


        <button
          class="btn btn-secondary"
          type="button"
          onclick="resetFilter()"
        >
          Reset Filter
        </button>

      </div>


      <div
        id="tableStatus"
        class="loading"
      >
        Memuat transaksi...
      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>
                Tanggal
              </th>

              <th>
                Duit Siapa
              </th>

              <th>
                Transaksi
              </th>

              <th>
                Nominal
              </th>

              <th>
                Catatan
              </th>

              <th>
                Aksi
              </th>

            </tr>

          </thead>


          <tbody id="expenseTable"></tbody>

        </table>

      </div>

    </div>

  </div>


  <!-- MODAL EDIT -->

  <div
    class="modal"
    id="editModal"
  >

    <div class="modal-box">

      <h2 class="card-title">
        Edit Pengeluaran
      </h2>


      <input
        type="hidden"
        id="editRow"
      >


      <div class="form-grid">

        <div>

          <label>
            Tanggal
          </label>

          <input
            type="date"
            id="editTanggal"
            required
          >

        </div>


        <div>

          <label>
            Duit siapa?
          </label>

          <select id="editPemilik">

            <option value="Aufar">
              Aufar
            </option>

            <option value="Mei">
              Mei
            </option>

            <option value="Tabungan Berdua">
              Tabungan Berdua
            </option>

          </select>

        </div>


        <div>

          <label>
            Transaksi
          </label>

          <select id="editKategori">

            <option value="Makan">
              Makan
            </option>

            <option value="Bensin">
              Bensin
            </option>

            <option value="Gojek">
              Gojek
            </option>

            <option value="Belanja">
              Belanja
            </option>

            <option value="Lain-lain">
              Lain-lain
            </option>

          </select>

        </div>


        <div>

          <label>
            Nominal (Rp)
          </label>

          <input
            type="number"
            id="editNominal"
            min="0"
            step="1"
            required
          >

        </div>


        <div class="full">

          <label>
            Catatan
          </label>

          <textarea
            id="editCatatan"
          ></textarea>

        </div>

      </div>


      <div class="modal-actions">

        <button
          class="btn btn-secondary"
          onclick="closeEdit()"
          type="button"
        >
          Batal
        </button>


        <button
          class="btn"
          onclick="saveEdit()"
          type="button"
        >
          Simpan Perubahan
        </button>

      </div>

    </div>

  </div>



<script>


/* =========================
   API URL
========================= */

const API_URL =
  "https://pengeluaran-berdua-api.faiqaufar.workers.dev/";


let allExpenses = [];



/* =========================
   UTIL
========================= */

function todayLocal() {

  const now = new Date();

  const local =
    new Date(
      now.getTime() -
      now.getTimezoneOffset() * 60000
    );

  return local
    .toISOString()
    .slice(0, 10);

}


function currentMonth() {

  return todayLocal()
    .slice(0, 7);

}


function rupiah(value) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(
    Number(value) || 0
  );

}


function escapeHtml(text) {

  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}



/* =========================
   API
   GitHub Pages -> Apps Script
========================= */

function apiGet(params) {

  return new Promise(
    async function(resolve, reject) {

      try {

        const query =
          new URLSearchParams(params);

        query.set(
          "_",
          Date.now()
        );


        const response =
          await fetch(
            API_URL +
            "?" +
            query.toString(),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Server mengembalikan HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (!data) {

          throw new Error(
            "Server mengembalikan data kosong."
          );

        }


        if (
          data.success === false
        ) {

          throw new Error(
            data.message ||
            "Terjadi kesalahan pada server."
          );

        }


        resolve(data);

      } catch (error) {

        reject(error);

      }

    }
  );

}



/* =========================
   INIT
========================= */

document
  .getElementById("tanggal")
  .value = todayLocal();


document
  .getElementById("filterBulan")
  .value = currentMonth();



/* =========================
   TAMBAH
========================= */

document
  .getElementById("expenseForm")
  .addEventListener(
    "submit",
    async function(e) {

      e.preventDefault();


      const btn =
        document.getElementById(
          "submitBtn"
        );


      const status =
        document.getElementById(
          "status"
        );


      const data = {

        action: "save",

        tanggal:
          document.getElementById(
            "tanggal"
          ).value,

        pemilik:
          document.getElementById(
            "pemilik"
          ).value,

        kategori:
          document.getElementById(
            "kategori"
          ).value,

        nominal:
          document.getElementById(
            "nominal"
          ).value,

        catatan:
          document.getElementById(
            "catatan"
          ).value.trim()

      };


      btn.disabled = true;

      status.className =
        "status";

      status.textContent =
        "Menyimpan...";


      try {

        const result =
          await apiGet(data);


        status.className =
          "status success";

        status.textContent =
          "✓ " +
          result.message;


        document
          .getElementById(
            "expenseForm"
          )
          .reset();


        document
          .getElementById(
            "tanggal"
          )
          .value = todayLocal();


        await loadExpenses();


      } catch (error) {

        status.className =
          "status error";

        status.textContent =
          "Gagal menyimpan: " +
          error.message;


      } finally {

        btn.disabled = false;

      }

    }
  );



/* =========================
   LOAD
========================= */

async function loadExpenses() {

  const tableStatus =
    document.getElementById(
      "tableStatus"
    );


  tableStatus.textContent =
    "Memuat transaksi...";


  try {

    const result =
      await apiGet({
        action: "list"
      });


    allExpenses =
      result.data || [];


    renderExpenses();


  } catch (error) {

    tableStatus.textContent =
      "Gagal memuat data: " +
      error.message;

  }

}



/* =========================
   RENDER
========================= */

function renderExpenses() {

  const month =
    document.getElementById(
      "filterBulan"
    ).value;


  const owner =
    document.getElementById(
      "filterPemilik"
    ).value;


  const filtered =
    allExpenses.filter(
      function(item) {

        const monthMatch =
          !month ||
          item.tanggal.startsWith(
            month
          );


        const ownerMatch =
          !owner ||
          item.pemilik === owner;


        return (
          monthMatch &&
          ownerMatch
        );

      }
    );


  let total = 0;
  let aufar = 0;
  let mei = 0;
  let berdua = 0;


  filtered.forEach(
    function(item) {

      const nominal =
        Number(item.nominal) || 0;


      total += nominal;


      if (
        item.pemilik === "Aufar"
      ) {
        aufar += nominal;
      }


      if (
        item.pemilik === "Mei"
      ) {
        mei += nominal;
      }


      if (
        item.pemilik ===
        "Tabungan Berdua"
      ) {
        berdua += nominal;
      }

    }
  );


  document
    .getElementById(
      "totalBulan"
    )
    .textContent =
    rupiah(total);


  document
    .getElementById(
      "totalAufar"
    )
    .textContent =
    rupiah(aufar);


  document
    .getElementById(
      "totalMei"
    )
    .textContent =
    rupiah(mei);


  document
    .getElementById(
      "totalBerdua"
    )
    .textContent =
    rupiah(berdua);


  const tbody =
    document.getElementById(
      "expenseTable"
    );


  if (!filtered.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          Belum ada transaksi.
        </td>
      </tr>
    `;


    document
      .getElementById(
        "tableStatus"
      )
      .textContent =
      "0 transaksi";


    return;

  }


  tbody.innerHTML =
    filtered
      .map(
        function(item) {

          const parts =
            item.tanggal.split("-");


          const displayDate =
            parts.length === 3
              ? parts[2] +
                "/" +
                parts[1] +
                "/" +
                parts[0]
              : item.tanggal;


          return `
            <tr>

              <td>
                ${escapeHtml(displayDate)}
              </td>

              <td>
                ${escapeHtml(item.pemilik)}
              </td>

              <td>
                ${escapeHtml(item.kategori)}
              </td>

              <td class="nominal">
                ${rupiah(item.nominal)}
              </td>

              <td>
                ${escapeHtml(item.catatan)}
              </td>

              <td class="actions">

                <button
                  class="btn-edit"
                  onclick="openEdit(${item.row})"
                >
                  Edit
                </button>

                <button
                  class="btn-danger"
                  onclick="deleteExpense(${item.row})"
                >
                  Hapus
                </button>

              </td>

            </tr>
          `;

        }
      )
      .join("");


  tbody.innerHTML += `
    <tr class="total-row">

      <td colspan="3">
        TOTAL PENGELUARAN
      </td>

      <td class="nominal">
        ${rupiah(total)}
      </td>

      <td colspan="2"></td>

    </tr>
  `;


  document
    .getElementById(
      "tableStatus"
    )
    .textContent =
    filtered.length +
    " transaksi";

}



/* =========================
   EDIT
========================= */

function openEdit(row) {

  const item =
    allExpenses.find(
      function(x) {
        return Number(x.row) === Number(row);
      }
    );


  if (!item) {

    alert(
      "Data transaksi tidak ditemukan."
    );

    return;

  }


  document
    .getElementById(
      "editRow"
    )
    .value = item.row;


  document
    .getElementById(
      "editTanggal"
    )
    .value = item.tanggal;


  document
    .getElementById(
      "editPemilik"
    )
    .value = item.pemilik;


  document
    .getElementById(
      "editKategori"
    )
    .value = item.kategori;


  document
    .getElementById(
      "editNominal"
    )
    .value = item.nominal;


  document
    .getElementById(
      "editCatatan"
    )
    .value = item.catatan || "";


  document
    .getElementById(
      "editModal"
    )
    .classList.add(
      "show"
    );

}



function closeEdit() {

  document
    .getElementById(
      "editModal"
    )
    .classList.remove(
      "show"
    );

}



async function saveEdit() {

  const data = {

    action: "edit",

    row:
      document.getElementById(
        "editRow"
      ).value,

    tanggal:
      document.getElementById(
        "editTanggal"
      ).value,

    pemilik:
      document.getElementById(
        "editPemilik"
      ).value,

    kategori:
      document.getElementById(
        "editKategori"
      ).value,

    nominal:
      document.getElementById(
        "editNominal"
      ).value,

    catatan:
      document.getElementById(
        "editCatatan"
      ).value.trim()

  };


  try {

    await apiGet(data);


    closeEdit();


    await loadExpenses();


    alert(
      "Pengeluaran berhasil diperbarui."
    );


  } catch (error) {

    alert(
      "Gagal mengedit: " +
      error.message
    );

  }

}



/* =========================
   DELETE
========================= */

async function deleteExpense(row) {

  if (
    !confirm(
      "Hapus transaksi ini?"
    )
  ) {
    return;
  }


  try {

    await apiGet({
      action: "delete",
      row: row
    });


    await loadExpenses();


  } catch (error) {

    alert(
      "Gagal menghapus: " +
      error.message
    );

  }

}



/* =========================
   FILTER
========================= */

document
  .getElementById(
    "filterBulan"
  )
  .addEventListener(
    "change",
    renderExpenses
  );


document
  .getElementById(
    "filterPemilik"
