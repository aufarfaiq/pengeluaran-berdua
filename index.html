<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pengeluaran Berdua">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Pengeluaran Berdua</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#111827}
    body{font-family:Arial,Helvetica,sans-serif;overflow:hidden}
    .app{height:100%;height:100dvh;display:flex;flex-direction:column}
    header{height:54px;display:flex;align-items:center;padding:0 16px;background:#111827;color:#fff;font-weight:700;flex:0 0 auto;padding-top:env(safe-area-inset-top)}
    .title{font-size:16px}
    .status{margin-left:auto;font-size:11px;font-weight:400;opacity:.75}
    iframe{border:0;width:100%;height:calc(100% - 54px);background:#f5f6f8;flex:1}
    .fallback{position:fixed;inset:0;background:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#333}
    .fallback button{margin-top:14px;padding:12px 18px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:700}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">💰 Pengeluaran Berdua</div>
      <div class="status" id="status">Memuat...</div>
    </header>
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbyRRasTbhcWRu9pimhwAdjVsBcj7bz58j7poSOfoN2G_5_ADC6Pa9-D40XHPmqmsCvRFQ/exec"
      title="Pengeluaran Berdua"
      allow="fullscreen"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

  <div class="fallback" id="fallback">
    <div>
      <h2>Tidak dapat membuka aplikasi</h2>
      <p>Periksa koneksi internet lalu coba lagi.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    }
    const frame = document.getElementById("appFrame");
    const status = document.getElementById("status");
    frame.addEventListener("load", () => status.textContent = "Siap");
    setTimeout(() => {
      if (status.textContent === "Memuat...") {
        status.textContent = "Online";
      }
    }, 4000);
  </script>
</body>
</html>
